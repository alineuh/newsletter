name: probe-models

on:
  workflow_dispatch:   # manual run only

permissions:
  contents: read
  models: read         # lets the built-in token call GitHub Models

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Probe GitHub Models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 probe_models.py
